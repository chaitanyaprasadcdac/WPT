<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="mycar.webp" alt="car he re baba" id="car" style="height: 150px; width: 400px; margin-left: 0px;" >
    <hr>
    <input type="button" value="Ahead" onclick="run(1)" >
    <input type="button" value="Back" onclick="run(0)" >
    <input type="button" value="Autorun" onclick="autorun()" >
    <script>
        var dist =0;

        function run(par){
            var obj=document.getElementById("car");
            obj.style.marginLeft=dist+"px";
            if(par==1)dist-=10; 
            else dist+=10;
        }

        function autorun(){
            setInterval(run,100);
        }
    </script>
</body>
</html>
