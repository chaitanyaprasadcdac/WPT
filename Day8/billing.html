           <center> <table id="billiingtable" border="1" style="width: 400px; text-align: center;">

                    <tr>
                        <th>No</th>

        <hr>
        <script>
            function showbill(){
                var totobj = document.getElementById("divtotal");
                var total=0;
                var productdata=localStorage.getItem("ProductsPurchased");
                if(productdata!=undefined && productdata!=null){

                    var productdatastr=JSON.parse(productdata);
                    var billtobj=document.getElementById("billingtbody");
                    for(i=0;i<productdatastr.length;i++){
                        var product=productdatastr[i];
                        total=total+product.Price;
                        var billui=`<tr>
                        <td>${i+1}</td>
                        <td>${product.Name}</td>
                        <td>${product.Price}</td>
                    </tr>`;
                    billtobj.innerHTML=billtobj.innerHTML+billui;
                    }
                    total=Math.ceil(total);

                    totobj.innerHTML=`<h2>Pleas Pay: ${(total)} INR</h2><input type="button" value="Pay" onclick="pay()">`

                }
                else{
                    alert("Go purchase something first man!");
                    window.location.href="shopping.html"
                }
            }
            showbill();

            function pay(){
                alert("Assuming You have paid redirecting you to shopping page!");
                localStorage.removeItem("ProductsPurchased");
                window.location.href="billing.html"
            }
            
        </script>
</body>
