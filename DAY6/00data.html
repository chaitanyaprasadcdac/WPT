<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1"><tbody><tr><td id="dataa"></td></tr></tbody></table>
    <div id="data"></div>
    <hr>
    <input type="button" value="getdata" onclick="get_data()">
    <script>
        var l= localStorage.getItem("Latitude");
        var lo= localStorage.getItem("Longitude");
        var obj =document.getElementById("dataa");
        function get_data(){
             obj.innerText=(l+"-"+lo);
        }
       
    </script>
</body>
</html>
