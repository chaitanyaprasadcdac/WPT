<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Dynamic conversion using capital letter.
        let a=10;
        console.log(a,typeof a);

        a= String(a);
         console.log(a,typeof a);

        a= Boolean(a);
         console.log(a,typeof a);

         a= Object(a);
         console.log(a,typeof a);

         a=Function(a);
          console.log(a,typeof a);
         a="3abc";
         a=Number(a);
         console.log(a,typeof a);
          a=null;
         a=Number(a);
         console.log(a,typeof a);
          a=undefined;
         a=Number(a);
         console.log(a,typeof a);

             </script>
</body>
</html>
